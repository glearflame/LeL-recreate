[package]
name = "horizon-launcher"
description = "Launcher/hub visual do Glear-Mine (estilo Horizon Offline Launcher). UI nativa em egui."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "glear-mine-launcher"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
egui = "0.29"
egui_extras = "0.29"
reqwest = { version = "0.12", features = ["blocking"] }
zip = "0.6"
dirs = "5.0"
serde_json = "1"
rfd = "0.15"
horizon-hud = { path = "../horizon-hud" }
